<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teoría de Colas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="layout">

    <!-- COLUMNA IZQUIERDA: config -->
    <div class="container">
      <h1>Teoría de Colas</h1>
      <p><strong>Parámetros de Simulación</strong></p>

      <div class="modifiers">

        <div class="mod-item">
          <label class="mod-header">
            <input type="checkbox" class="modificador-check" data-mod="descanso" />
            <span>Descanso</span>
            <span class="mod-badge" id="badge_descanso">OFF</span>
          </label>
          <div class="mod-param" id="param-row_descanso">
            <span class="param-label">Duración descanso ΔD (s)</span>
            <input type="number" disabled id="param_descanso" placeholder="Descanso (s)" value="60" />
            <span class="param-label">Duración trabajo ΔT (s)</span>
            <input type="number" disabled id="param_descanso_trabajo" placeholder="Trabajo (s)" value="30" />
          </div>
        </div>

        <div class="mod-item">
          <label class="mod-header">
            <input type="checkbox" class="modificador-check" data-mod="abandono" />
            <span>Abandono</span>
            <span class="mod-badge" id="badge_abandono">OFF</span>
          </label>
          <div class="mod-param" id="param-row_abandono">
            <input type="number" disabled id="param_abandono" placeholder="Paciencia (s)" value="10" />
          </div>
        </div>

        <div class="mod-item">
          <label class="mod-header">
            <input type="checkbox" class="modificador-check" data-mod="prioridades" />
            <span>Prioridades</span>
            <span class="mod-badge" id="badge_prioridades">OFF</span>
          </label>
          <div class="mod-param" id="param-row_prioridades">
            <span class="param-label">Intervalo llegada tipo B (s)</span>
            <input type="number" disabled id="param_prioridades" placeholder="tLL tipo B (s)" value="45" />
          </div>
        </div>

        <div class="mod-item">
          <label class="mod-header">
            <input type="checkbox" class="modificador-check" data-mod="seguridad" />
            <span>Zona de Seguridad</span>
            <span class="mod-badge" id="badge_seguridad">OFF</span>
          </label>
          <div class="mod-param" id="param-row_seguridad">
            <input type="number" disabled id="param_seguridad" placeholder="Cap. máx. cola" value="5" />
          </div>
        </div>

      </div>

      <br />

      <h5>Tiempo de Llegada (s)</h5>
      <input type="number" id="tiempoLlegada" value="35" />

      <h5>Tiempo de Servicio (s)</h5>
      <input type="number" id="tiempoServicio" value="40" />

      <h5>Tiempo de Simulación (s)</h5>
      <input type="number" id="tiempoSimulacion" value="500" />

      <h5>Velocidad de animación</h5>
      <div class="slider-row">
        <span class="slider-label">Rápido</span>
        <input type="range" id="velocidad" min="20" max="800" value="120" step="20" />
        <span class="slider-label">Lento</span>
      </div>

      <div class="botones">
        <button id="btnIniciar" onclick="iniciarSimulacion()">▶ Iniciar</button>
        <button id="btnDetener" onclick="detenerSimulacion()" disabled>■ Detener</button>
        <button class="btn-limpiar" onclick="limpiarConsola()">⌫ Limpiar</button>
      </div>
    </div>

    <!-- COLUMNA DERECHA: consola -->
    <div id="consoleBox"></div>

  </div>

  <!-- Orden obligatorio: motor → modificadores → ui -->
  <script src="motor.js"></script>
  <script src="modificadores/descanso.js"></script>
  <script src="modificadores/abandono.js"></script>
  <script src="modificadores/prioridades.js"></script>
  <script src="modificadores/seguridad.js"></script>
  <script src="ui.js"></script>

</body>
</html>
